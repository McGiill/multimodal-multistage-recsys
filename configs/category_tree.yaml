# 3단계 카테고리: 대분류 → 중분류 → 소분류 (예시, 팀에서 확정)
상의:
  니트: [라운드넥 니트, 브이넥 니트, 카디건]
  후드: [후드티, 후드집업]
  셔츠: [옥스포드 셔츠, 린넨 셔츠]
하의:
  데님: [스트레이트 데님, 와이드 데님]
  슬랙스: [와이드 슬랙스, 테이퍼드 슬랙스]
아우터:
  자켓: [블레이저, 데님 자켓]
  코트: [롱코트, 하프코트]
  패딩: [숏패딩, 롱패딩]
신발:
  스니커즈: [로우탑, 하이탑]
  구두: [로퍼, 더비슈즈]
가방:
  백팩: [데일리 백팩, 노트북 백팩]
  숄더백: [호보백, 토트백]
액세서리:
  모자: [볼캡, 비니]
  양말: [크루삭스, 발목양말]
