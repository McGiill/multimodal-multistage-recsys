seed: 42

clip:
  model_name: patrickjohncyh/fashion-clip   # 모델을 바꾸면 인덱스는 모델별 폴더에 따로 저장됨
                          # 패션 데이터로 다시 학습한 CLIP (transformers). 기본 CLIP(openai/clip-vit-base-patch32)보다
                          # test 전 유형에서 높음 (이미지 MRR 0.529 → 0.644, 2026-10-12)
  batch_size: 32
  index_device: auto      # 인덱스 구축용: auto | cpu | cuda | mps
  serve_device: cpu       # API 서빙용 (과제 응답시간 기준은 CPU)
  pad_to_square: true     # 세로로 긴 상품 이미지를 흰 여백으로 정사각형을 만든 뒤 인코딩
                          # (false면 CLIP 기본 전처리: 짧은 변 기준 center crop → 위아래가 잘림)

index:
  type: hnsw              # hnsw | ivfpq | ivfflat | flat
  nlist: 256              # IVF 클러스터 수
  m: 16                   # PQ sub-quantizer 수 (512차원 → 32차원씩)
  nbits: 8
  nprobe: 16              # IVF 검색 시 탐색할 클러스터 수
  hnsw_m: 32
  ef_construction: 200
  ef_search: 128

retrieval:
  candidate_k: 200        # 인덱스마다 가져오는 후보 수 (정밀 재채점 전)

# 가중치는 전부 valid 쿼리로 탐색해서 정한다 (python -m src.evaluation.tune_search). test는 보고용으로만.
text_query:
  image_weight: 0.4       # CLIP 점수 = w * (텍스트→상품 이미지) + (1-w) * (텍스트→상품 텍스트)
  bm25_weight: 0.4        # 텍스트 점수 = (1-l) * CLIP + l * BM25 (0이면 CLIP만)
                          # valid 탐색 (2026-11-03): CLIP만(w 0.1) MRR 0.784 / NDCG 0.600 → 융합 0.931 / 0.749

image_query:              # 이미지 점수 = 이미지 유사도(0~1) + 사진의 색·소분류 추정 확률 가점 (0이면 유사도만)
  color_weight: 0.75      # 분류기: src/search/attributes.py (상품 이미지 임베딩 → 색 / 소분류)
  category_weight: 0.5    # valid 탐색 (2026-11-10, 정답 기준 color_family): 가점 없이 MRR 0.727 / NDCG 0.427 → 0.804 / 0.600
                          # (기존 기준으로 탐색했을 때(2026-11-03)는 color 0.5 / category 0.5: tune_<모델>.json)
                          # (가점을 더 세게 주면 NDCG는 조금 오르지만 HitRate가 떨어져서 제외: tune_search.choose)

hybrid:
  text_weight: 0.7        # 하이브리드 점수 = w * 텍스트 경로 + (1-w) * 이미지 경로 (valid, color_family 기준 0.967 / 0.866)

attributes:               # 색 / 소분류 분류기 학습 (indexer가 마지막에 실행)
  epochs: 300
  lr: 0.01
  weight_decay: 0.0001

default_top_k: 10

paths:
  catalog: data/processed/products.parquet
  image_root: data/raw/hm             # 카탈로그 image_path의 기준 폴더
  articles: data/raw/hm/articles.csv  # 평가셋 생성 시 카탈로그 밖 상품(이미지 쿼리용)을 찾는 데 사용
  index_dir: artifacts/indexes/search # 하위에 모델 이름별 폴더가 생김
  eval_set: data/processed/search_eval_v2.parquet  # eval.relevance 기준 (기존 기준 평가셋: search_eval.parquet)
  metrics_dir: artifacts/metrics

eval:
  k: 10
  relevance: color_family # 이미지·하이브리드 정답 기준 (2026-11-09 확정, src/evaluation/build_search_eval.py)
                          # color_family: 비슷한 디자인 + 비슷한 색 / design: 기존 기준 (같은 디자인이면 색 무관 최고 정답)
  mrr_min_grade: 1        # MRR은 관련도가 이 값 이상인 첫 결과의 순위로 계산
  n_text_queries: 1000    # 절반은 상품명 쿼리, 절반은 속성 쿼리
  n_image_queries: 1000
  n_hybrid_queries: 500
