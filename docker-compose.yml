# 서비스 실행: docker compose up --build
# 학습·평가·테스트: docker compose run --rm tools make train (tools는 up에 포함되지 않음)
# 데이터(data/)와 모델·인덱스(artifacts/)는 용량이 커서 이미지에 넣지 않고 폴더를 연결한다.
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    container_name: api-server
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HF_HOME: /app/artifacts/models   # CLIP·검출 모델 가중치를 artifacts/models에 받고 재사용
      OMP_NUM_THREADS: "4"
      CLOSET_PREFERENCE_URL: ${CLOSET_PREFERENCE_URL:-http://host.docker.internal:8767/api/closet/preference-seed}
      OPENBLAS_NUM_THREADS: "1"
      EVENT_LOG_PATH: /app/artifacts/runtime/events.sqlite3
      MODEL_VERSION: ${MODEL_VERSION:-latest}
    ports: ["${API_HOST_PORT:-8000}:8000"]
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data:ro
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s               # 시작할 때 CLIP 모델과 인덱스를 불러온다
    cpus: 4                            # 명세 최소 사양 (CPU 4코어) 기준으로 응답시간을 맞춘다
    mem_limit: 16g

  dashboard:
    build: { context: ., dockerfile: docker/dashboard.Dockerfile }
    container_name: dashboard
    environment:
      API_BASE_URL: http://api:8000
    ports: ["${DASHBOARD_HOST_PORT:-8501}:8501"]
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./docs:/app/docs:ro
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  simulator:
    build: { context: ., dockerfile: docker/simulator.Dockerfile }
    container_name: simulator
    environment:
      API_BASE_URL: http://api:8000
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
    depends_on:
      api: { condition: service_healthy }

  # docker compose --profile ct up --build: 영속 로그를 감시하고 새 버전을 검증한다.
  # 기존 서비스 모델을 바꾸려면 검증된 버전을 registry activate로 명시적으로 선택한다.
  monitor:
    build: { context: ., dockerfile: docker/tools.Dockerfile }
    profiles: [ct]
    command: ["python", "-m", "src.ct.monitor"]
    environment:
      EVENT_LOG_PATH: /app/artifacts/runtime/events.sqlite3
      MODEL_VERSION: ${MODEL_VERSION:-latest}
    volumes:
      - ./artifacts:/app/artifacts

  retrainer:
    build: { context: ., dockerfile: docker/tools.Dockerfile }
    profiles: [ct]
    command: ["python", "-m", "src.ct.trigger"]
    environment:
      EVENT_LOG_PATH: /app/artifacts/runtime/events.sqlite3
      REDIS_HOST: ""
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data:ro
    cpus: 4
    mem_limit: 16g

  tools:
    build: { context: ., dockerfile: docker/tools.Dockerfile }
    profiles: [tools]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HF_HOME: /app/artifacts/models
      EVENT_LOG_PATH: /app/artifacts/runtime/events.sqlite3
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./tests:/app/tests:ro
    depends_on:
      redis: { condition: service_healthy }
